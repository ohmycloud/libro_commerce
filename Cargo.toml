[package]
name = "libro_commerce"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
dotenv = "0.15.0"
jsonwebtoken = "9.3.1"
leptos = "0.8.2"
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.5", features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1.45.0", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
