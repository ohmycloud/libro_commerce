[package]
name = "libro_commerce"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = "0.8.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"

# Frontend-only dependencies (for WebAssembly)
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12.15", features = ["json"] }
# You might need to use web-sys or gloo for browser-specific functionality

# Backend-only dependencies (will not be compiled to WebAssembly)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
argon2 = "0.5.3"
dotenv = "0.15.0"
jsonwebtoken = "9.3.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
